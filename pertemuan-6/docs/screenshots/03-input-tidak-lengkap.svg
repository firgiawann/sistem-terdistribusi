<text x="30" y="36" fill="#e6edf3" font-size="20" font-weight="bold">Skenario 3 — Input tidak lengkap → 400</text>
<text x="30" y="88" fill="#8b949e" font-size="17">Mini-LMS Submission/File Service · Kelompok 4 · POST /api/submissions</text>
<text x="30" y="113" fill="#7ee787" font-size="17" font-weight="bold">$ curl -X POST localhost:8000/api/submissions \</text>
<text x="30" y="140" fill="#7ee787" font-size="17">    -d '{"assignment_id":"tugas-01"}'</text>
<text x="30" y="167" fill="#ff7b72" font-size="17">→ HTTP 400 Bad Request</text>
<text x="30" y="194" fill="#e6edf3" font-size="17">{</text>
<text x="30" y="221" fill="#ff7b72" font-size="17">  "error": "input_tidak_lengkap",</text>
<text x="30" y="248" fill="#e6edf3" font-size="17">  "message": "Field wajib belum diisi.",</text>
<text x="30" y="275" fill="#79c0ff" font-size="17">  "missing": ["student_id"]</text>
<text x="30" y="302" fill="#e6edf3" font-size="17">}</text>
</svg>