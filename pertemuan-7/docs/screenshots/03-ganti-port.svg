<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="383" font-family="ui-monospace, Menlo, Consolas, monospace">
<rect width="1160" height="383" fill="#0d1117"/>
<rect width="1160" height="58" fill="#161b22"/>
<text x="30" y="36" fill="#e6edf3" font-size="20" font-weight="bold">Skenario 3 — Ganti port tanpa ubah source code</text>
<text x="30" y="88" fill="#8b949e" font-size="17">Mini-LMS Registry · Kelompok 4 · uji perpindahan alamat</text>
<text x="30" y="113" fill="#8b949e" font-size="17" font-weight="bold">$ # course pindah 8103 → 8203, cukup ubah services.json</text>
<text x="30" y="140" fill="#79c0ff" font-size="17">  "course": "http://127.0.0.1:8103"  →  "http://127.0.0.1:8203"</text>
<text x="30" y="167" fill="#e6edf3" font-size="17"></text>
<text x="30" y="194" fill="#7ee787" font-size="17" font-weight="bold">$ curl 127.0.0.1:8101/api/gateway/course   # kode gateway &amp; client TIDAK diubah</text>
<text x="30" y="221" fill="#7ee787" font-size="17">→ HTTP 200 OK</text>
<text x="30" y="248" fill="#e6edf3" font-size="17">  { "via": "gateway", "resolved_from": "course",</text>
<text x="30" y="275" fill="#e6edf3" font-size="17">    "base_url": "http://127.0.0.1:8203", "upstream_status": 200 }</text>
<text x="30" y="302" fill="#e6edf3" font-size="17"></text>
<text x="30" y="329" fill="#7ee787" font-size="17">→ Gateway otomatis memakai alamat BARU. Nama logis memisahkan client dari lokasi. ✓</text>
</svg>